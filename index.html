<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ilm Card Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230A3A2A%22/%3E%3Crect x=%2220%22 y=%2214%22 width=%2224%22 height=%2236%22 rx=%224%22 fill=%22%23F1CD78%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: deep-green sidebar, cream work area, white panels; gold marks the one thing to act on. */
:root{
  --green:#0A3A2A; --green-2:#0F4C37; --green-3:#16634A; --navy:#0A1530;
  --gold:#C8952B; --gold-2:#F1CD78; --gold-soft:#FBF0D3;
  --bg:#F5F1E6; --panel:#FFFFFF; --line:#E4DDCB; --line-2:#EFE9DA;
  --ink:#13201A; --ink-2:#4B5A52; --ink-3:#7C887F;
  --good:#1F7A4D; --good-bg:#E3F3EA; --warn:#A86A00; --warn-bg:#FCEFD2; --bad:#B23A2E; --bad-bg:#FBE4E1; --info:#2C5A8C; --info-bg:#E4EDF7;
  --f-display:'Young Serif',Georgia,serif; --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--green);color:#E8EFE9;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.logo i{width:30px;height:38px;border-radius:6px;background:linear-gradient(150deg,var(--gold-2),var(--gold));box-shadow:inset 0 0 0 2px rgba(10,58,42,.25)}
.logo b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block;line-height:1.1}
.logo small{color:#A9C2B4;font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:#C9D8CF;font-weight:600}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:rgba(241,205,120,.14);color:var(--gold-2)}
.nav a .ct{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 8px;color:#fff}
.side .foot{margin-top:auto;font-size:12.5px;color:#A9C2B4;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1)}
.side .foot a{color:var(--gold-2)}
/* main */
.main{min-width:0;padding:22px clamp(16px,3vw,36px) 48px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;line-height:1.1}
.top .sub{color:var(--ink-3);font-size:14px}
.top .grow{flex:1}
.demo{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid #EBD39A;color:#6E4F0C;border-radius:12px;padding:9px 14px;font-size:13.5px;margin-bottom:18px}
.demo b{font-weight:700}
.menu{display:none}
/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#CFC5AE}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-2)}
.btn.gold{background:var(--gold-2);border-color:#E3B858;color:#3D2A00}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:focus-visible,.inp:focus-visible,select:focus-visible,.nav a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.inp,select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;min-width:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .inp{flex:1 1 220px}
/* panels */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.panel h2{font-size:15px;margin:0 0 4px;font-weight:700}
.panel .hint{color:var(--ink-3);font-size:13px;margin:0 0 12px}
.kpi .lab{color:var(--ink-2);font-size:13px;font-weight:600}
.kpi .val{font-family:var(--f-display);font-size:34px;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi .meta{font-size:13px;color:var(--ink-3)}
.kpi.hl{background:linear-gradient(150deg,#123F2F,var(--green));color:#fff;border-color:transparent}
.kpi.hl .lab,.kpi.hl .meta{color:#BFD3C7}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);background:#FBF9F3;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#FBF8EF}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.02em}
.who b{display:block}
.who small{color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-good{background:var(--good-bg);color:var(--good)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-info{background:var(--info-bg);color:var(--info)}
.p-muted{background:#EFECE3;color:#5E675F}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.count{color:var(--ink-3);font-size:13px;margin:10px 2px 0}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:8px;padding:6px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .12s}
.tip b{font-variant-numeric:tabular-nums}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.hbar .track{height:12px;background:#F1ECDF;border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--green-3);border-radius:0 4px 4px 0}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li small{color:var(--ink-3);display:block}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,21,48,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:41;box-shadow:-20px 0 60px rgba(10,21,48,.2);display:flex;flex-direction:column}
.drawer header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.drawer .body{padding:18px 22px;overflow:auto;flex:1}
.drawer .acts{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:600}
.x{margin-left:auto;border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--ink-3)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:#fff;border-radius:18px;z-index:41;padding:22px;box-shadow:0 30px 80px rgba(10,21,48,.3)}
.modal h3{margin:0 0 14px;font-family:var(--f-display);font-weight:400;font-size:24px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.form .full{grid-column:1/-1}
.form .acts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.codes div{border:1px dashed #D9CBA3;background:#FFFBEF;border-radius:10px;padding:8px 10px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;font-weight:600;box-shadow:0 14px 40px rgba(0,0,0,.25)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .menu{display:inline-flex}
}
@media (max-width:520px){.kpis{grid-template-columns:1fr}.form{grid-template-columns:1fr}.top h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><i></i><div><b>Ilm Card</b><small>Admin portal</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Pilot: Muzaffargarh<br><a href="/">View public website</a></div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="btn menu" id="menuBtn" type="button" aria-label="Open menu">☰</button>
      <div><h1 id="title">Dashboard</h1><div class="sub" id="subtitle"></div></div>
      <div class="grow"></div>
      <div id="topActs" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>
    <div class="demo" id="demoNote"><b>Demo data.</b> Records are sample data stored in this browser only. Connect a database before real students are enrolled.</div>
    <div id="view"></div>
  </main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
/* ================= data ================= */
var KEY='ilm-admin-v1';
var DISTRICTS=['Muzaffargarh','Rajanpur','DG Khan'];
var CENTRES={'Muzaffargarh':['Ilm Centre Muzaffargarh','GPS Basti Malana','GPS Chowk Sarwar'],'Rajanpur':['GPS Jampur Road','GPS Fazilpur'],'DG Khan':['GPS Kot Chutta','GPS Choti Zareen']};
var CLASSES=['Nursery','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Matric'];
var GIRLS=['Ayesha','Fatima','Zainab','Maryam','Hira','Sana','Iqra','Rabia','Amna','Kiran','Mehwish','Nimra','Saba','Bushra','Asma'];
var BOYS=['Ali','Ahmed','Hamza','Bilal','Usman','Saad','Hassan','Imran','Zubair','Faisal','Waqas','Adeel','Shahid','Junaid','Rehan'];
var LAST=['Khan','Baloch','Lashari','Gurmani','Qureshi','Bhatti','Jatoi','Mazari','Leghari','Dasti','Khosa','Rind'];
var MS=864e5;
function rnd(seed){var s=seed;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}
function pick(r,a){return a[Math.floor(r()*a.length)];}
function iso(d){return new Date(d).toISOString().slice(0,10);}
function code16(){var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint32Array(16),s='';crypto.getRandomValues(b);for(var i=0;i<16;i++){s+=A[b[i]%A.length];if(i%4===3&&i<15)s+='-';}return s;}

function seed(){
  var r=rnd(20261010),now=Date.now(),students=[],i;
  for(i=1;i<=64;i++){
    var girl=r()<.52,d=r()<.6?DISTRICTS[0]:(r()<.5?DISTRICTS[1]:DISTRICTS[2]);
    var joined=now-Math.floor(r()*240)*MS, plan=r()<.18?'Sponsored':(r()<.55?'Term pass':'Monthly');
    var paidUntil=plan==='Sponsored'?now+120*MS:(plan==='Term pass'?joined+180*MS:now+(Math.floor(r()*45)-12)*MS);
    var lastSync=Math.floor(r()<.82?r()*16:16+r()*30);
    students.push({id:'IC-'+String(1000+i),name:(girl?pick(r,GIRLS):pick(r,BOYS))+' '+pick(r,LAST),girl:girl,cls:pick(r,CLASSES.slice(1)),district:d,centre:pick(r,CENTRES[d]),
      guardian:'03'+Math.floor(r()*9+1)+'•-•••'+String(Math.floor(r()*9000+1000)),plan:plan,joined:iso(joined),paidUntil:iso(paidUntil),lastSync:lastSync,quiz:Math.round(45+r()*50),nudged:false,card:'SD-'+String(4000+i)});
  }
  var shops=[{id:'S1',name:'Madina Mobile Zone',district:'Muzaffargarh',commission:8,sold:46,pending:9500},{id:'S2',name:'Al-Rehman Communication',district:'Muzaffargarh',commission:8,sold:31,pending:4000},
    {id:'S3',name:'Basti Malana Easyload',district:'Muzaffargarh',commission:10,sold:18,pending:2500},{id:'S4',name:'Jampur Cell Point',district:'Rajanpur',commission:10,sold:12,pending:1500},{id:'S5',name:'Kot Chutta Mobiles',district:'DG Khan',commission:10,sold:9,pending:0}];
  var vouchers=[];
  for(i=0;i<24;i++){var st=i<9?'Redeemed':(i<17?'Sold':'Unsold');var s=students[i%students.length];
    vouchers.push({code:code16(),value:i%5===0?2500:500,shop:shops[i%shops.length].name,status:st,student:st==='Redeemed'?s.id:'',created:iso(now-(30-i)*MS)});}
  var sponsors=[{id:'P1',name:'Usman R. (Dubai)',type:'Overseas',amount:25000,children:10,date:iso(now-40*MS),status:'Assigned'},{id:'P2',name:'Faisal Traders, Multan',type:'Company',amount:50000,children:20,date:iso(now-22*MS),status:'Received'},
    {id:'P3',name:'Dr. Amna S. (Manchester)',type:'Overseas',amount:12500,children:5,date:iso(now-9*MS),status:'Pledged'},{id:'P4',name:'Neighbourhood committee, Basti Malana',type:'Community',amount:7500,children:3,date:iso(now-3*MS),status:'Pledged'}];
  var exams=[{id:'E1',date:iso(now+16*MS),centre:'GPS Basti Malana',district:'Muzaffargarh',seats:120,registered:84,status:'Scheduled'},{id:'E2',date:iso(now+16*MS),centre:'GPS Chowk Sarwar',district:'Muzaffargarh',seats:80,registered:51,status:'Scheduled'},
    {id:'E3',date:iso(now+23*MS),centre:'GPS Jampur Road',district:'Rajanpur',seats:60,registered:22,status:'Scheduled'},{id:'E4',date:iso(now-60*MS),centre:'GPS Basti Malana',district:'Muzaffargarh',seats:80,registered:38,status:'Completed'}];
  return {students:students,shops:shops,vouchers:vouchers,sponsors:sponsors,exams:exams,log:[]};
}
var DB;
function load(){try{var s=localStorage.getItem(KEY);DB=s?JSON.parse(s):seed();}catch(e){DB=seed();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
load();

/* ================= helpers ================= */
var $=function(s,el){return (el||document).querySelector(s);};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rs(n){return 'Rs '+Math.round(n).toLocaleString('en-PK');}
function fmtDate(s){var d=new Date(s);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function today(){var d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function status(s){if(s.plan!=='Sponsored'&&new Date(s.paidUntil).getTime()<today())return 'Lapsed';if(s.lastSync>21)return 'At risk';return 'Active';}
function pillFor(st){var m={'Active':'p-good','At risk':'p-warn','Lapsed':'p-bad','Redeemed':'p-good','Sold':'p-info','Unsold':'p-muted','Pledged':'p-warn','Received':'p-info','Assigned':'p-good','Scheduled':'p-info','Completed':'p-muted','Sponsored':'p-info','Monthly':'p-muted','Term pass':'p-good'};return '<span class="pill '+(m[st]||'p-muted')+'">'+esc(st)+'</span>';}
function monthly(s){return s.plan==='Monthly'?500:(s.plan==='Term pass'?2500/6:0);}
function toast(msg){var old=document.querySelector('.toast');if(old)old.remove();var t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function logEvent(t){DB.log.unshift({t:t,at:new Date().toISOString()});DB.log=DB.log.slice(0,40);}
function download(name,text,type){var b=new Blob([text],{type:type||'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}
function csv(rows){return rows.map(function(r){return r.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\n');}
function closeLayer(){$('#layer').innerHTML='';}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLayer();});

/* ================= nav ================= */
var ICON={
 dash:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
 stu:'<path d="M12 3 1 9l11 6 9-4.9V17h2V9zM5 13.2v4L12 21l7-3.8v-4L12 17z"/>',
 vou:'<path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zm6 2v8h2V8z"/>',
 shop:'<path d="M4 4h16l1 5a3 3 0 0 1-5 2 3 3 0 0 1-4 0 3 3 0 0 1-4 0 3 3 0 0 1-5-2zm1 9h14v7H5z"/>',
 spo:'<path d="M12 21s-8-5-8-11a5 5 0 0 1 8-3 5 5 0 0 1 8 3c0 6-8 11-8 11z"/>',
 exam:'<path d="M6 2h9l5 5v15H6zm8 1v5h5M9 13h8v2H9zm0 4h8v2H9z"/>',
 set:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4-2 1 .2 2-1.8 1.4-1.9-.6-1.5 1.5.6 1.9-1.4 1.8-2-.2-1 2h-2l-1-2-2 .2-1.4-1.8.6-1.9-1.5-1.5-1.9.6L3.2 15l.2-2-2-1v-2l2-1-.2-2L5 5.6l1.9.6L8.4 4.7 7.8 2.8 9.2 1h2.6z"/>'
};
var ROUTES=[['dashboard','Dashboard','dash'],['students','Students','stu'],['vouchers','Vouchers & cards','vou'],['shops','Shops & cash','shop'],['sponsors','Sponsorships','spo'],['exams','Exam days','exam'],['settings','Data & settings','set']];
function renderNav(cur){
  var risk=DB.students.filter(function(s){return status(s)!=='Active';}).length;
  $('#nav').innerHTML=ROUTES.map(function(r){var ct=r[0]==='students'&&risk?'<span class="ct" title="Need attention">'+risk+'</span>':'';
    return '<a href="#/'+r[0]+'" class="'+(r[0]===cur?'on':'')+'"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+ICON[r[2]]+'</svg>'+r[1]+ct+'</a>';}).join('');
}
$('#menuBtn').addEventListener('click',function(){$('#side').classList.toggle('open');});
$('#nav').addEventListener('click',function(){$('#side').classList.remove('open');});

function head(title,sub,acts){$('#title').textContent=title;$('#subtitle').textContent=sub||'';$('#topActs').innerHTML=acts||'';document.title=title+' · Ilm Card Admin';}

/* ================= dashboard ================= */
function vDashboard(){
  var S=DB.students,act=S.filter(function(s){return status(s)==='Active';}),risk=S.filter(function(s){return status(s)==='At risk';}),lapsed=S.filter(function(s){return status(s)==='Lapsed';});
  var paying=S.filter(function(s){return s.plan!=='Sponsored'&&status(s)!=='Lapsed';}),rev=paying.reduce(function(a,s){return a+monthly(s);},0);
  var girls=S.filter(function(s){return s.girl;}).length,pending=DB.shops.reduce(function(a,s){return a+s.pending;},0);
  head('Dashboard','Pilot overview for '+new Date().toLocaleDateString('en-GB',{month:'long',year:'numeric'}),'<a class="btn primary" href="#/students?new=1">+ Enrol student</a>');
  // enrolment by month (last 8 months)

function drawLine(el,labels,vals,unit){
  var W=640,H=230,L=36,R=12,T=14,B=28,max=Math.max(4,Math.ceil(Math.max.apply(null,vals)/10)*10);
  var x=function(i){return L+(W-L-R)*i/(vals.length-1);},y=function(v){return T+(H-T-B)*(1-v/max);};
  var pts=vals.map(function(v,i){return [x(i),y(v)];}),line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+x(vals.length-1)+' '+y(0)+' L'+x(0)+' '+y(0)+' Z',ticks=[0,max/2,max];
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Enrolled learners by month, rising to '+vals[vals.length-1]+'">'+
   '<defs><linearGradient id="ag" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#16634A" stop-opacity=".22"/><stop offset="1" stop-color="#16634A" stop-opacity="0"/></linearGradient></defs>'+
   ticks.map(function(t){return '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="#EFE9DA"/><text x="'+(L-8)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="#7C887F">'+t+'</text>';}).join('')+
   labels.map(function(l,i){return '<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="#7C887F">'+esc(l)+'</text>';}).join('')+
   '<path d="'+area+'" fill="url(#ag)"/><path d="'+line+'" fill="none" stroke="#16634A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
   '<line id="cx" y1="'+T+'" y2="'+y(0)+'" stroke="#C8952B" stroke-dasharray="3 3" opacity="0"/><circle id="cd" r="5" fill="#16634A" stroke="#fff" stroke-width="2" opacity="0"/>'+
   '<circle cx="'+pts[pts.length-1][0]+'" cy="'+pts[pts.length-1][1]+'" r="4.5" fill="#16634A" stroke="#fff" stroke-width="2"/>'+
   '<text x="'+(pts[pts.length-1][0]-8)+'" y="'+(pts[pts.length-1][1]-10)+'" text-anchor="end" font-size="12" font-weight="700" fill="#13201A">'+vals[vals.length-1]+'</text>'+
   '<rect x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent" id="hit"/></svg><div class="tip" id="tip"></div>';
  var svg=el.querySelector('svg'),tip=el.querySelector('#tip'),cx=el.querySelector('#cx'),cd=el.querySelector('#cd');
  function at(ev){var r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W,i=Math.round((px-L)/(W-L-R)*(vals.length-1));i=Math.max(0,Math.min(vals.length-1,i));
    cx.setAttribute('x1',pts[i][0]);cx.setAttribute('x2',pts[i][0]);cx.setAttribute('opacity',1);cd.setAttribute('cx',pts[i][0]);cd.setAttribute('cy',pts[i][1]);cd.setAttribute('opacity',1);
    tip.innerHTML=esc(labels[i])+': <b>'+vals[i]+'</b> '+unit;tip.style.left=(pts[i][0]/W*100)+'%';tip.style.top=(pts[i][1]/H*r.height)+'px';tip.style.opacity=1;}
  svg.addEventListener('pointermove',at);svg.addEventListener('pointerleave',function(){tip.style.opacity=0;cx.setAttribute('opacity',0);cd.setAttribute('opacity',0);});
}

   DB.shops.map(function(s){return '<tr><td><b>'+esc(s.name)+'</b></td><td>'+esc(s.district)+'</td><td class="num">'+s.commission+'%</td><td class="num">'+s.sold+'</td><td class="num"><b>'+rs(s.pending)+'</b></td><td>'+(s.pending>0?'<button class="btn sm primary" data-col="'+s.id+'">Mark collected</button>':'<span class="pill p-good">Settled</span>')+'</td></tr>';}).join('')+'</tbody></table></div>';
  $('#view').onclick=function(e){var b=e.target.closest('[data-col]');if(!b)return;var s=DB.shops.find(function(x){return x.id===b.dataset.col;});logEvent(rs(s.pending)+' collected from '+s.name);toast(rs(s.pending)+' collected from '+s.name);s.pending=0;save();route();};
  $('#addShop').addEventListener('click',function(){modal('Add a shop','<label class="full">Shop name<input class="inp" name="n" required></label><label>District<select name="d">'+DISTRICTS.map(function(d){return '<option>'+d+'</option>';}).join('')+'</select></label><label>Commission %<input class="inp" type="number" name="c" min="0" max="30" value="10" required></label>','Add shop',function(f){DB.shops.push({id:'S'+(Date.now()%1e6),name:f.n.value.trim(),district:f.d.value,commission:+f.c.value,sold:0,pending:0});logEvent('Shop added: '+f.n.value);save();toast('Shop added');route();});});
}

/* ================= sponsors ================= */
function vSponsors(){
  var tot=DB.sponsors.reduce(function(a,s){return a+s.amount;},0),kids=DB.sponsors.reduce(function(a,s){return a+s.children;},0);
  head('Sponsorships',rs(tot)+' pledged, covering '+kids+' children for a term','<button class="btn primary" id="addP">+ Record pledge</button>');
  $('#view').innerHTML='<div class="tw"><table><thead><tr><th>Sponsor</th><th>Type</th><th class="num">Amount</th><th class="num">Children (Rs 2,500 each)</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>'+
   DB.sponsors.map(function(p){var next=p.status==='Pledged'?'<button class="btn sm" data-p="'+p.id+'" data-to="Received">Mark received</button>':(p.status==='Received'?'<button class="btn sm primary" data-p="'+p.id+'" data-to="Assigned">Assign to students</button>':'');
     return '<tr><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.type)+'</td><td class="num">'+rs(p.amount)+'</td><td class="num">'+p.children+'</td><td>'+fmtDate(p.date)+'</td><td>'+pillFor(p.status)+'</td><td>'+next+'</td></tr>';}).join('')+'</tbody></table></div>'+
   '<p class="count">Assigning moves lapsed or at-risk students onto sponsored cards first, so the children most likely to drop out are covered.</p>';
  $('#view').onclick=function(e){var b=e.target.closest('[data-p]');if(!b)return;var p=DB.sponsors.find(function(x){return x.id===b.dataset.p;});
    if(b.dataset.to==='Assigned'){var cand=DB.students.filter(function(s){return s.plan!=='Sponsored'&&status(s)!=='Active';}).concat(DB.students.filter(function(s){return s.plan!=='Sponsored'&&status(s)==='Active';})).slice(0,p.children);
      cand.forEach(function(s){s.plan='Sponsored';s.paidUntil=iso(Date.now()+182*MS);});toast(cand.length+' students moved to sponsored cards');logEvent(p.name+' assigned to '+cand.length+' students');}
    else toast('Marked as received');
    p.status=b.dataset.to;save();route();};
  $('#addP').addEventListener('click',function(){modal('Record a pledge','<label class="full">Sponsor name<input class="inp" name="n" required></label><label>Type<select name="t"><option>Overseas</option><option>Company</option><option>Community</option><option>Individual</option></select></label><label>Amount (Rs)<input class="inp" type="number" name="a" min="2500" step="2500" value="25000" required></label>','Save pledge',function(f){var a=+f.a.value;DB.sponsors.unshift({id:'P'+(Date.now()%1e6),name:f.n.value.trim(),type:f.t.value,amount:a,children:Math.floor(a/2500),date:iso(Date.now()),status:'Pledged'});logEvent('Pledge recorded: '+f.n.value);save();toast('Pledge recorded');route();});});
}

/* ================= exams ================= */
function vExams(){
  head('Exam days','Sunday term exams in government school rooms','<button class="btn primary" id="addE">+ Schedule exam day</button>');
  var rows=DB.exams.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  $('#view').innerHTML='<div class="tw"><table><thead><tr><th>Date</th><th>Centre</th><th>District</th><th class="num">Registered</th><th class="num">Seats</th><th>Fill</th><th>Status</th></tr></thead><tbody>'+
   rows.map(function(e){var f=Math.round(e.registered/e.seats*100);return '<tr><td>'+fmtDate(e.date)+'</td><td><b>'+esc(e.centre)+'</b></td><td>'+esc(e.district)+'</td><td class="num">'+e.registered+'</td><td class="num">'+e.seats+'</td><td style="min-width:140px"><div class="hbar" style="grid-template-columns:minmax(0,1fr) 40px;margin:0"><div class="track"><div class="fill" style="width:'+f+'%"></div></div><span class="n">'+f+'%</span></div></td><td>'+pillFor(e.status)+'</td></tr>';}).join('')+'</tbody></table></div>';
  $('#addE').addEventListener('click',function(){var all=[];DISTRICTS.forEach(function(d){CENTRES[d].forEach(function(c){if(c.indexOf('GPS')===0)all.push([c,d]);});});
    modal('Schedule an exam day','<label>Date<input class="inp" type="date" name="dt" required></label><label>Seats<input class="inp" type="number" name="s" min="10" max="400" value="80" required></label><label class="full">Government school<select name="c">'+all.map(function(x,i){return '<option value="'+i+'">'+esc(x[0])+' ('+esc(x[1])+')</option>';}).join('')+'</select></label>','Schedule',function(f){var x=all[+f.c.value];DB.exams.push({id:'E'+(Date.now()%1e6),date:f.dt.value,centre:x[0],district:x[1],seats:+f.s.value,registered:0,status:'Scheduled'});logEvent('Exam day scheduled at '+x[0]);save();toast('Exam day scheduled');route();});});
}

/* ================= settings ================= */
function vSettings(){
  head('Data & settings','Backups and activity');
  $('#view').innerHTML='<div class="grid two"><div class="panel"><h2>Backup</h2><p class="hint">Download every record as one JSON file.</p><button class="btn" id="bk">Download backup</button>'+
   '<h2 style="margin-top:22px">Reset demo data</h2><p class="hint">Replace everything in this browser with fresh sample data. This cannot be undone.</p><button class="btn" id="rs1">Reset demo data</button><div id="rsc"></div></div>'+
   '<div class="panel"><h2>Recent activity</h2><p class="hint">Actions taken in this browser</p><div class="list">'+(DB.log.length?DB.log.slice(0,12).map(function(l){return '<div class="li"><div class="grow">'+esc(l.t)+'<small>'+new Date(l.at).toLocaleString('en-GB')+'</small></div></div>';}).join(''):'<div class="empty">No activity yet. Enrol a student or generate vouchers and it will show here.</div>')+'</div></div></div>';
  $('#bk').addEventListener('click',function(){download('ilm-admin-backup.json',JSON.stringify(DB,null,2),'application/json');});
  $('#rs1').addEventListener('click',function(){$('#rsc').innerHTML='<p style="margin:12px 0 8px;color:var(--bad);font-weight:600">Replace all records with sample data?</p><button class="btn primary" id="rsy">Yes, reset</button> <button class="btn" id="rsn">Keep my data</button>';
    $('#rsy').onclick=function(){DB=seed();save();toast('Demo data reset');route();};$('#rsn').onclick=function(){$('#rsc').innerHTML='';};});
}

/* ================= router ================= */
var VIEWS={dashboard:vDashboard,students:vStudents,vouchers:vVouchers,shops:vShops,sponsors:vSponsors,exams:vExams,settings:vSettings};
function route(){
  var h=(location.hash||'#/dashboard').slice(2).split('?'),name=VIEWS[h[0]]?h[0]:'dashboard',params={};
  (h[1]||'').split('&').forEach(function(kv){if(kv){var p=kv.split('=');params[p[0]]=p[1];}});
  closeLayer();renderNav(name);$('#view').onclick=null;VIEWS[name](params);
  if(params.new)history.replaceState(null,'','#/'+name);
}
addEventListener('hashchange',route);
route();
})();
</script>
</body>
</html>
